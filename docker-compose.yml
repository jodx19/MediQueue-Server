version: '3.8'

services:
  # Database
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mediqueue-database
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: "MediQueue@2024!"
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - mediqueue-network

  # Backend API
  api:
    build:
      context: ./MediQueue.Server
      dockerfile: Dockerfile
    container_name: mediqueue-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=database;Database=MediQueueEMR;User Id=sa;Password=MediQueue@2024!;TrustServerCertificate=true;
    ports:
      - "7000:80"
    depends_on:
      - database
    networks:
      - mediqueue-network
    volumes:
      - ./logs:/app/logs

  # Frontend
  frontend:
    build:
      context: ./MediQueue.Client
      dockerfile: Dockerfile
    container_name: mediqueue-frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - mediqueue-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: mediqueue-redis
    ports:
      - "6379:6379"
    networks:
      - mediqueue-network
    volumes:
      - redis_data:/data

volumes:
  sqlserver_data:
  redis_data:

networks:
  mediqueue-network:
    driver: bridge
